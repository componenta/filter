name: Final Mutation Audit

on:
  push:
    branches:
      - audit/filter-tdd-fixes-20260911
    paths:
      - .github/workflows/final-mutation-audit.yml

jobs:
  mutate:
    name: Pest mutation testing PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Run mutation audit
        shell: bash
        run: |
          set -o pipefail
          ./vendor/bin/pest --mutate --everything --parallel --covered-only --exclude-group=performance 2>&1 | tee mutation-report.txt
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-mutation-report-php-${{ matrix.php }}
          path: mutation-report.txt
          if-no-files-found: error
