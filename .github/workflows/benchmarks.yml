name: Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Run PHPBench
        shell: bash
        run: |
          set -o pipefail
          composer benchmark 2>&1 | tee benchmark-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-php-${{ matrix.php }}
          path: benchmark-report.txt
