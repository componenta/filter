name: Mutation Audit

on:
  push:
    paths:
      - '.github/workflows/mutation-audit.yml'
      - 'tests/ExactDivisibilityOracleTest.php'
      - 'tests/Fixtures/divisibility-vectors.json'
      - 'tests/FilterVarInputOwnershipTest.php'
      - 'tests/FilterVarFlatArrayEquivalenceTest.php'
      - 'tests/PercentageIntervalBoundaryTest.php'
      - 'tests/NumericRestrictedPrecisionTest.php'
      - 'tests/Fixtures/float-decimal-restricted.php'
      - 'tests/DateRangeTimezoneOwnershipTest.php'
      - 'tests/FileExtensionBoundaryTest.php'
      - 'tests/MergingFilterReplayIntegrityTest.php'
      - 'composer.json'
  workflow_dispatch:

jobs:
  mutate:
    name: Pest mutation testing PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run mutation audit
        shell: bash
        run: |
          set -o pipefail
          ./vendor/bin/pest --mutate --everything --parallel --covered-only --exclude-group=performance 2>&1 | tee mutation-report.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-php-${{ matrix.php }}
          path: mutation-report.txt
          if-no-files-found: error
